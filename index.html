<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emoji Tycoon: GALAXY</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg: #050505; --panel: #14141f; --card: #1e1e28; --accent: #ff0055; --gold: #ffd700; --text: #ffffff; --green: #00ff88; --blue: #00ccff; --purple: #bc13fe; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: #000; margin: 0; height: 100vh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Rajdhani', sans-serif; color: var(--text); }
        #game-app { width: 100%; max-width: 480px; height: 100%; background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); position: relative; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.8); overflow: hidden; }

        /* PANTALLA INICIO */
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .start-icon { font-size: 5rem; margin-bottom: 20px; animation: floatIcon 3s infinite ease-in-out; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .start-btn { background: var(--green); color: #000; font-size: 1.5rem; font-weight: 900; padding: 15px 50px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); animation: pulseBtn 2s infinite; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #lang-select { display: none; gap: 20px; margin-top: 30px; }
        .lang-btn { background: #222; border: 2px solid #444; font-size: 2.5rem; padding: 10px 20px; border-radius: 15px; cursor: pointer; transition: 0.2s; }
        .lang-btn:hover { border-color: var(--gold); transform: scale(1.1); background: #333; }

        /* UI JUEGO */
        .header { background: rgba(15, 15, 20, 0.98); padding: 10px 15px; border-bottom: 1px solid #333; z-index: 20; flex-shrink: 0; }
        .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .money { color: var(--green); font-weight: 900; font-size: 1.5rem; letter-spacing: 1px; }
        .gems-pill { background: rgba(255, 204, 0, 0.1); border: 1px solid rgba(255, 204, 0, 0.4); color: var(--gold); padding: 4px 12px; border-radius: 20px; font-weight: 800; }
        .news-bar { background: #050505; height: 25px; width: 100%; overflow: hidden; white-space: nowrap; display: flex; align-items: center; border-bottom: 1px solid #222; flex-shrink: 0; }
        .news-text { font-size: 0.75rem; color: #888; animation: scrollText 20s linear infinite; padding-left: 100%; font-weight: 600; text-transform: uppercase; }
        @keyframes scrollText { 0% { transform: translateX(0); } 100% { transform: translateX(-150%); } }
        .game-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #main-emoji { font-size: 16vh; cursor: pointer; z-index: 5; filter: drop-shadow(0 0 30px rgba(255,255,255,0.1)); transition: transform 0.1s; }
        #main-emoji:active { transform: scale(0.9); }
        .status-container { width: 70%; text-align: center; margin-top: 15px; z-index: 5; }
        .bar-bg { width: 100%; height: 6px; background: #222; border-radius: 10px; overflow: hidden; margin-bottom: 5px; border: 1px solid #333; }
        .bar-fill { height: 100%; width: 0%; transition: width 0.3s; }
        .xp-fill { background: var(--blue); }
        .fever-fill { background: linear-gradient(90deg, #f1c40f, #e74c3c); }
        .status-text { font-size: 0.7rem; font-weight: bold; color: #666; letter-spacing: 1px; }
        
        .tabs { display: flex; background: #080808; border-top: 1px solid #333; height: 60px; flex-shrink: 0; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex: 1; background: none; border: none; color: #555; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .tab span { font-size: 1.4rem; filter: grayscale(1); margin-bottom: 3px; }
        .tab.active { background: rgba(255,255,255,0.03); }
        .tab.active span { filter: grayscale(0); transform: scale(1.15); }
        .tab:nth-child(1).active { color: var(--green); border-top: 2px solid var(--green); }
        .tab:nth-child(2).active { color: var(--blue); border-top: 2px solid var(--blue); }
        .tab:nth-child(3).active { color: var(--gold); border-top: 2px solid var(--gold); }
        .tab:nth-child(4).active { color: var(--purple); border-top: 2px solid var(--purple); }
        .tab-locked { opacity: 0.5; }
        .lock-icon { position: absolute; top: 5px; right: 10px; font-size: 0.6rem; background: #000; border-radius: 50%; padding: 2px; }
        .panel-container { height: 38%; background: var(--panel); overflow-y: auto; padding: 15px; padding-bottom: 80px; }
        .panel { display: none; animation: fadeIn 0.2s; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 10px; margin-bottom: 8px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .card-left { display: flex; align-items: center; gap: 12px; }
        .card-icon { font-size: 1.8rem; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .btn-buy { background: var(--blue); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; min-width: 75px; font-family: 'Rajdhani', sans-serif; }
        .btn-buy:disabled { background: #333 !important; opacity: 0.6; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 15000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .popup { background: #1a1a25; width: 85%; max-width: 400px; padding: 25px; border-radius: 20px; border: 1px solid #444; text-align: center; animation: popIn 0.3s; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 15px; font-family: 'Rajdhani', sans-serif; }
        .skins-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .skin-item { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 10px; border: 1px solid #333; text-align: center; cursor: pointer; }
        .skin-item.active { border-color: var(--green); background: rgba(0, 255, 136, 0.1); }
        .skin-item.locked { filter: grayscale(1); opacity: 0.5; }
        .drone { position: absolute; font-size: 3.5rem; z-index: 50; animation: droneFly 12s linear; cursor: pointer; top: 15%; left:-30%; }
        @keyframes droneFly { 0% { left: -30%; } 100% { left: 130%; } }
        .supply-crate { position: absolute; font-size: 3rem; z-index: 45; animation: drop 1s forwards; cursor: pointer; }
        @keyframes drop { to { top: 70%; transform: rotate(-10deg); } }
        #toast-area { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 100%; z-index: 14000; pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .toast { background: rgba(255,255,255,0.95); color: #000; padding: 8px 20px; border-radius: 50px; font-weight: bold; font-size: 0.85rem; margin-bottom: 8px; animation: slideDown 2s forwards; }
        @keyframes slideDown { 0% { opacity:0; transform:translateY(-10px); } 10% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-10px); } }
        .particle { position: absolute; font-weight: 900; pointer-events: none; animation: floatUp 0.8s forwards; font-size: 1.2rem; z-index: 10; }
        @keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }
        
        /* Efecto Glitch para Hacking */
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }
        .hacking-text { color: var(--green); font-family: monospace; font-size: 1.5rem; animation: glitch 0.2s infinite; }
    </style>
</head>
<body>

<div id="game-app">
    <div id="start-screen">
        <div class="start-icon">💎</div>
        <h1 style="font-size: 3rem; margin: 0; color: var(--text); text-shadow: 0 0 20px var(--purple);">EMOJI TYCOON</h1>
        <p style="color: #888; font-size: 1.1rem; margin-top: 10px;">Galaxy Edition v49</p>
        <button id="btn-play" class="start-btn" onclick="showLangSelector()">START / JUGAR</button>
        <div id="lang-select"><button class="lang-btn" onclick="setLang('es')">🇪🇸</button><button class="lang-btn" onclick="setLang('en')">🇬🇧</button></div>
    </div>

    <div id="hack-progress-modal" class="overlay" style="z-index: 20000;">
        <div class="popup" style="border-color: var(--green); min-height: 200px;">
            <div style="font-size:3rem; margin-bottom:10px;">👨‍💻</div>
            <h2 id="hack-status-text" class="hacking-text">HACKING...</h2>
            <div class="bar-bg" style="height: 10px; margin: 20px 0;"><div class="bar-fill" style="background:var(--green); width:0%;" id="hack-bar"></div></div>
            <p id="hack-subtext" style="color:#888; font-size:0.8rem; font-family:monospace;">Connecting to node...</p>
        </div>
    </div>

    <div id="offline-modal" class="overlay">
        <div class="popup" style="border-color: var(--gold);">
            <div style="font-size:3rem; margin-bottom:10px;">💤</div>
            <h2 id="txt-offline-title" style="color:var(--gold);"></h2>
            <p id="txt-offline-msg"></p>
            <h1 id="offline-amount" style="color:#fff; font-size: 2.5rem; margin:10px 0;">$0</h1>
            <button id="btn-off-video" class="modal-btn" style="background:var(--green); color:#000;" onclick="claimOffline(true)"></button>
            <button id="btn-off-norm" style="background:transparent; border:none; color:#666; margin-top:15px; font-size:0.8rem; text-decoration:underline; cursor: pointer;" onclick="claimOffline(false)"></button>
        </div>
    </div>

    <div id="box-modal" class="overlay">
        <div class="popup" style="border-color: var(--purple);">
            <div style="font-size:3rem; margin-bottom:10px;">🎁</div>
            <h2 id="txt-box-title" style="color:var(--purple);"></h2>
            <p id="txt-box-msg"></p>
            <button id="btn-box-vid" class="modal-btn" style="background:linear-gradient(45deg, #8e44ad, #9b59b6); color:#fff;" onclick="openBox(true)"></button>
            <button id="btn-box-norm" class="modal-btn" style="background:#333; color:#aaa;" onclick="openBox(false)"></button>
        </div>
    </div>

    <div id="hacker-modal" class="overlay">
        <div class="popup" style="border-color: var(--accent);">
            <div style="font-size:3rem; animation: pulseBtn 0.5s infinite;">🚨</div>
            <h2 id="txt-hacker-title" style="color:var(--accent);"></h2>
            <p id="txt-hacker-msg"></p>
            <h2 id="hacker-loss" style="color:#fff;">-$0</h2>
            <button id="btn-hacker-vid" class="modal-btn" style="background:var(--green); color:#000;" onclick="resolveHacker(true)"></button>
            <button id="btn-hacker-acc" style="background:transparent; border:none; color:#666; margin-top:15px; font-size:0.8rem; text-decoration:underline; cursor: pointer;" onclick="resolveHacker(false)"></button>
        </div>
    </div>

    <div id="toast-area"></div>

    <div class="header">
        <div class="top-row">
            <div style="display:flex; align-items:center; gap:5px;"><div style="font-weight:900; font-size:1.1rem;">EMOJI TYCOON</div></div>
            <div class="gems-pill">💎 <span id="ui-gems">0</span></div>
        </div>
        <div class="top-row" style="margin-top:5px;">
            <div class="money" id="ui-money">$0</div>
            <div style="font-size:0.8rem; color:#888;">+<span id="ui-pps">0</span>/s</div>
        </div>
        <div style="width:100%; height:4px; background:#222; margin-top:5px; border-radius:2px; overflow:hidden;"><div id="threat-bar" style="height:100%; width:0%; background:var(--accent); transition:width 0.5s;"></div></div>
    </div>
    <div class="news-bar"><div class="news-text" id="news-text">...</div></div>
    <div class="game-zone">
        <button onclick="if(confirm('Reset?')) { localStorage.clear(); location.reload(); }" style="position:absolute; top:10px; right:10px; background:none; border:none; font-size:1.5rem; cursor:pointer; opacity:0.3; z-index: 10;">⚙️</button>
        <div id="main-emoji" onclick="doClick(event)">👶</div>
        <div class="status-container">
            <div class="bar-bg"><div class="bar-fill xp-fill" id="xp-bar"></div></div>
            <div class="status-text"><span id="lbl-lvl">NIVEL</span> <span id="ui-lvl">1</span></div>
            <div class="bar-bg" style="margin-top:10px;"><div class="bar-fill fever-fill" id="fever-bar"></div></div>
            <div class="status-text" id="fever-text" style="color:var(--gold); opacity:0.5;">FIEBRE</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="tab('prod', this)"><span>🏭</span><div id="lbl-prod">Prod</div></button>
        <button class="tab" onclick="tab('def', this)"><span>🛡️</span><div id="lbl-def">Def</div></button>
        <button class="tab" onclick="tab('btc', this)"><span>🪙</span><div id="lbl-crypto">Crypto</div></button>
        <button class="tab" onclick="tab('shop', this)"><span>🛒</span><div id="lbl-shop">Tienda</div></button>
        <button class="tab tab-locked" id="tab-world-btn" onclick="clickWorld(this)"><span>🌍</span><div id="lbl-world">Mundo</div><div class="lock-icon">🔒</div></button>
    </div>

    <div class="panel-container">
        <div id="prod" class="panel active"></div>
        <div id="def" class="panel"></div>
        <div id="btc" class="panel">
            <div style="background:#000; padding:15px; border-radius:15px; text-align:center; border:1px solid #333;">
                <div style="color:#888; font-size:0.8rem;">WALLET</div>
                <div style="font-size:2.5rem; color:#f39c12; font-weight:bold; font-family:monospace;" id="btc-ui">0</div>
                <div style="color:#aaa; font-size:0.9rem; margin-bottom:15px;">1 BTC = <span id="btc-price-ui" style="font-weight:bold;">$50</span> <span id="btc-trend"></span></div>
                <div style="display:flex; gap:10px;"><button class="modal-btn" style="background:#f39c12; color:#000; margin:0;" onclick="mineBTC()" id="btn-mine"></button><button class="modal-btn" style="background:#27ae60; color:#fff; margin:0;" onclick="sellBTC()" id="btn-sell"></button></div>
                <button id="btn-broker" class="modal-btn" style="background:#2a2a35; color:#fff; border:1px solid var(--gold); margin-top:10px; font-size:0.8rem;" onclick="activateBroker()"></button>
            </div>
            <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:10px; margin:15px 0; font-size:0.75rem; color:#888; line-height:1.4;">
                <b style="color:#fff;" id="txt-guide-title"></b><br><span id="txt-guide-1"></span><br><span id="txt-guide-2"></span>
            </div>
            <div style="margin-top:20px; font-weight:bold; color:var(--purple); border-bottom:1px solid #333; padding-bottom:5px;" id="lbl-dark"></div>
            <div id="dark-list"></div>
        </div>
        <div id="shop" class="panel">
            <div style="display:flex; gap:10px; margin-bottom:15px;"><button class="modal-btn" style="background:#222; color:#fff; border:1px solid #444; margin:0;" onclick="showShopSection('items')" id="btn-upgrades"></button><button class="modal-btn" style="background:#222; color:#fff; border:1px solid #444; margin:0;" onclick="showShopSection('skins')">🎭 SKINS</button></div>
            <div id="items-view">
                <div class="card" style="background:rgba(188, 19, 254, 0.1); border-color:var(--purple);"><div class="card-left"><div class="card-icon">💎</div><b id="txt-pack">Pack</b></div><button class="btn-buy" style="background:var(--purple); color:white;" onclick="watchAdForGems()" id="btn-pack"></button></div>
                <div id="gem-list"></div>
            </div>
            <div id="skins-view" style="display:none; grid-template-columns: repeat(3, 1fr); gap:10px;"></div>
        </div>
        <div id="world" class="panel">
            <div style="text-align:center; padding:10px; background:rgba(0,200,255,0.1); border:1px solid var(--blue); border-radius:10px; margin-bottom:15px; font-weight:bold; color:var(--blue);" id="lbl-missions"></div>
            <div id="mission-list"></div>
        </div>
        <div id="world-modal" class="overlay">
            <div class="popup" style="border-color: var(--blue);">
                <div style="font-size: 3rem;">🔒</div>
                <h2 id="txt-world-title" style="color:var(--blue);"></h2>
                <div style="margin: 15px 0; text-align:left;"><div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#aaa;"><span id="txt-req-gems"></span><span id="txt-gems">0/100</span></div><div class="bar-bg"><div class="bar-fill xp-fill" id="bar-gems"></div></div></div>
                <div style="margin: 15px 0; text-align:left;"><div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#aaa;"><span id="txt-req-serv"></span><span id="txt-tech">NO</span></div><div class="bar-bg"><div class="bar-fill" style="background:var(--green)" id="bar-tech"></div></div></div>
                <button id="btn-world-close" class="modal-btn" style="background:#333; color:#fff;" onclick="document.getElementById('world-modal').style.display='none'"></button>
            </div>
        </div>
    </div>
</div>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    let lang = 'es';
    
    // --- DICCIONARIOS ---
    const dict = {
        es: {
            offT: "¡HAS VUELTO!", offM: "Tus máquinas trabajaron duro.", offV: "⚡ HACK (x1.5)", offN: "Recoger normal",
            boxT: "SUMINISTROS", boxM: "¿Qué paquete quieres abrir?", boxV: "⚡ HACK CRATE", boxN: "Caja Común",
            hackT: "¡HACKER DETECTADO!", hackM: "Van a robar el 20% de tus fondos.", hackV: "🛡️ DEFENDER", hackA: "Aceptar pérdida",
            worldT: "ZONA RESTRINGIDA", reqG: "Gemas (100)", reqS: "Servidor (Nvl 1)", close: "CERRAR",
            prod: "Prod", def: "Def", cry: "Crypto", shop: "Tienda", world: "Mundo",
            lvl: "NIVEL", fever: "FIEBRE", mine: "⛏️ MINAR", sell: "💰 VENDER",
            broker: "🤖 AUTO-VENDEDOR (1 MIN)", working: "🤖 TRABAJANDO...", done: "🤖 Fin del turno",
            gT: "ℹ️ GUÍA CRIPTO:", g1: "- Precios entre $5 y $60.", g2: "- VERDE: Subió. ROJO: Bajó.",
            dark: "MERCADO NEGRO", upg: "📦 MEJORAS", pack: "Pack Gemas", vid: "FREE (+3-5)", miss: "MISIONES GLOBALES",
            ready: "¡LISTO!", miss_ok: "Misión OK", bought: "¡Comprado!", saved: "🛡️ SALVADO", loss: "🚨 PÉRDIDA",
            spy: "🕵️ Espía", bot: "🤖 Bot", over: "⚡ Overclock",
            hack_p: "HACKING...", wait: "ESPERA: "
        },
        en: {
            offT: "WELCOME BACK!", offM: "Your machines worked hard.", offV: "⚡ HACK (x1.5)", offN: "Collect normal",
            boxT: "SUPPLIES", boxM: "Which package do you want?", boxV: "⚡ HACK CRATE", boxN: "Common Crate",
            hackT: "HACKER DETECTED!", hackM: "Stealing 20% of funds.", hackV: "🛡️ DEFEND", hackA: "Accept Loss",
            worldT: "RESTRICTED AREA", reqG: "Gems (100)", reqS: "Server (Lvl 1)", close: "CLOSE",
            prod: "Prod", def: "Def", cry: "Crypto", shop: "Shop", world: "World",
            lvl: "LEVEL", fever: "FEVER", mine: "⛏️ MINE", sell: "💰 SELL",
            broker: "🤖 AUTO-BROKER (1 MIN)", working: "🤖 WORKING...", done: "🤖 Shift ended",
            gT: "ℹ️ CRYPTO GUIDE:", g1: "- Prices between $5 and $60.", g2: "- GREEN: Up. RED: Down.",
            dark: "BLACK MARKET", upg: "📦 UPGRADES", pack: "Gem Pack", vid: "FREE (+3-5)", miss: "GLOBAL MISSIONS",
            ready: "READY!", miss_ok: "Mission OK", bought: "Bought!", saved: "🛡️ SAVED", loss: "🚨 LOST",
            spy: "🕵️ Spy", bot: "🤖 Bot", over: "⚡ Overclock",
            hack_p: "HACKING...", wait: "WAIT: "
        }
    };
    function getText(key) { return dict[lang][key] || key; }

    function showLangSelector() { document.getElementById('btn-play').style.display = 'none'; document.getElementById('lang-select').style.display = 'flex'; }
    function setLang(l) { lang = l; startGame(); }
    
    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const t = dict[lang];
        document.getElementById('txt-offline-title').innerText=t.offT; document.getElementById('txt-offline-msg').innerText=t.offM;
        document.getElementById('btn-off-video').innerText=t.offV; document.getElementById('btn-off-norm').innerText=t.offN;
        document.getElementById('txt-box-title').innerText=t.boxT; document.getElementById('txt-box-msg').innerText=t.boxM;
        document.getElementById('btn-box-vid').innerText=t.boxV; document.getElementById('btn-box-norm').innerText=t.boxN;
        document.getElementById('txt-hacker-title').innerText=t.hackT; document.getElementById('txt-hacker-msg').innerText=t.hackM;
        document.getElementById('btn-hacker-vid').innerText=t.hackV; document.getElementById('btn-hacker-acc').innerText=t.hackA;
        document.getElementById('txt-world-title').innerText=t.worldT; document.getElementById('txt-req-gems').innerText=t.reqG;
        document.getElementById('txt-req-serv').innerText=t.reqS; document.getElementById('btn-world-close').innerText=t.close;
        document.getElementById('lbl-prod').innerText=t.prod; document.getElementById('lbl-def').innerText=t.def;
        document.getElementById('lbl-crypto').innerText=t.cry; document.getElementById('lbl-shop').innerText=t.shop;
        document.getElementById('lbl-world').innerText=t.world; document.getElementById('lbl-lvl').innerText=t.lvl;
        document.getElementById('fever-text').innerText=t.fever; document.getElementById('btn-mine').innerText=t.mine;
        document.getElementById('btn-sell').innerText=t.sell; document.getElementById('btn-broker').innerText=t.broker;
        document.getElementById('txt-guide-title').innerText=t.gT; document.getElementById('txt-guide-1').innerText=t.g1;
        document.getElementById('txt-guide-2').innerText=t.g2; document.getElementById('lbl-dark').innerText=t.dark;
        document.getElementById('btn-upgrades').innerText=t.upg; document.getElementById('txt-pack').innerText=t.pack;
        document.getElementById('btn-pack').innerText=t.vid; document.getElementById('lbl-missions').innerText=t.miss;
        checkOfflineEarnings();
        setInterval(()=>{const k="n"+(Math.floor(Math.random()*5)+1);document.getElementById('news-text').innerText=(lang=='es'?k:k)}, 8000); 
        setInterval(spawnUFO_Logic, 1000);
        updateUI();
    }

    // --- LÓGICA DE HACKEO PSICOLÓGICO ---
    function executeHackLogic(callback, cooldownId) {
        if (cooldownId === 'gemHack') {
            const now = Date.now();
            const last = game.lastGemHack || 0;
            const diff = now - last;
            if (diff < 180000) { 
                const waitSec = Math.ceil((180000 - diff) / 1000);
                notify("⏳ " + getText('wait') + waitSec + "s");
                return;
            }
            game.lastGemHack = now; 
        }

        const modal = document.getElementById('hack-progress-modal');
        const bar = document.getElementById('hack-bar');
        const title = document.getElementById('hack-status-text');
        const sub = document.getElementById('hack-subtext');
        
        modal.style.display = 'flex'; bar.style.width = '0%';
        title.innerText = "HACKING...";
        
        const codes = ["0x2F...", "Bypassing...", "Accessing...", "Decrypting...", "Brute-Force..."];
        let step = 0;
        
        let width = 0;
        let interval = setInterval(() => {
            width += 1.5; 
            bar.style.width = width + '%';
            
            // Efecto visual Matrix
            if(Math.random() > 0.8) {
                sub.innerText = codes[step % codes.length] + " " + Math.floor(Math.random()*999);
                step++;
            }

            if (width >= 100) { 
                clearInterval(interval); 
                title.innerText = "ACCESS GRANTED";
                title.style.color = "#fff";
                playSfx('coin'); // Sonido de éxito
                setTimeout(() => { modal.style.display = 'none'; callback(); }, 600); 
            }
        }, 30);
    }

    const machinesDB = [ {name:"Script",name_en:"Script",cost:15,prod:1,icon:"👶"}, {name:"PC Gamer",name_en:"Gaming PC",cost:150,prod:12,icon:"💻"}, {name:"Servidor",name_en:"Server",cost:1400,prod:90,icon:"🖥️"}, {name:"Crypto Farm",name_en:"Crypto Farm",cost:25000,prod:600,icon:"🏭"}, {name:"IA God",name_en:"AI God",cost:500000,prod:4000,icon:"🧠"} ];
    const defDB = [ {name:"Antivirus",name_en:"Antivirus",cost:500,desc:"-10% Amenaza",desc_en:"-10% Threat",icon:"💊"}, {name:"Firewall",name_en:"Firewall",cost:5000,desc:"-25% Amenaza",desc_en:"-25% Threat",icon:"🔥"}, {name:"Señuelo",name_en:"Decoy",cost:50000,desc:"Gana BTC",desc_en:"Earn BTC",icon:"💣"} ];
    const gemItemsDB = [ {id:'coffee',name:"Café",name_en:"Coffee",cost:5,desc:"x2 Prod (1min)",icon:"☕"}, {id:'shield',name:"Escudo",name_en:"Shield",cost:15,desc:"Bloquea 1 ataque",desc_en:"Blocks 1 attack",icon:"🛡️"}, {id:'warp',name:"Salto",name_en:"Warp",cost:20,desc:"+2h Cash",desc_en:"+2h Cash",icon:"⏩"} ];
    const darkItemsDB = [ {id:'bot',name:"Bot",name_en:"Bot",cost:50,desc:"Auto-clic",desc_en:"Auto-click",icon:"🤖"}, {id:'spy',name:"Spy",name_en:"Spy",cost:100,desc:"Predice Precio",desc_en:"Predict Price",icon:"👁️"}, {id:'over',name:"Overclock",name_en:"Overclock",cost:500,desc:"+10% Prod",desc_en:"+10% Prod",icon:"⚡"} ];
    const skinsDB = [ {id:"baby",icon:"👶",cost:0}, {id:"cool",icon:"😎",cost:50}, {id:"hacker",icon:"😈",cost:150}, {id:"robot",icon:"🤖",cost:300}, {id:"alien",icon:"👽",cost:500}, {id:"king",icon:"👑",cost:1000} ];
    const missionsDB = [ {name:"Hack WiFi",name_en:"Hack WiFi",cost:5000,reward:"+1 Gema/min",reward_en:"+1 Gem/min"}, {name:"Banco",name_en:"Bank Hack",cost:500000,reward:"x2 Valor Dinero",reward_en:"x2 Cash Value"}, {name:"Matrix",name_en:"Matrix",cost:1000000000,reward:"MODO DIOS",reward_en:"GOD MODE"} ];
    
    let game = { money:0, gems:20, btc:0, machines:[0,0,0,0,0], security:[0,0,0], ownedSkins:["baby"], currentSkin:"baby", missions:[0,0,0], hasSpy:false, hasShield:false, overclock:0, lastLogin:Date.now(), worldUnlocked:false, level:1, xp:0, lastGemHack: 0 };
    let threat=0, btcPrice=20, nextPrice=25, oldPrice=20, pendingOffline=0, boostMult=1, brokerActive=false, fever=0, feverMode=false, nextUfoTime=Date.now()+120000;
    if(localStorage.getItem('EmojiGalaxyV49')) { try{game=JSON.parse(localStorage.getItem('EmojiGalaxyV49'));}catch(e){} }
    
    function playSfx(type) { if(audioCtx.state==='suspended')audioCtx.resume(); const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now=audioCtx.currentTime; if(type==='coin'){osc.frequency.setValueAtTime(1200,now);osc.frequency.exponentialRampToValueAtTime(3000,now+0.1);gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.01,now+0.1);osc.start(now);osc.stop(now+0.1);} }
    function getPPS() { let p=0; machinesDB.forEach((m,i)=>p+=(m.prod*game.machines[i])); if(game.missions[2])p*=100; return p*(1+(game.overclock*0.1))*boostMult; }
    function doClick(e) { let fm=feverMode?5:1; let val=(1+(getPPS()*0.05))*fm; game.money+=val; game.xp+=val; let req=game.level*2000; if(game.xp>=req){game.level++;game.xp=0;game.gems+=2;notify("LEVEL "+game.level+"!");} document.getElementById('xp-bar').style.width=Math.min((game.xp/req)*100,100)+"%"; document.getElementById('ui-lvl').innerText=game.level; playSfx('coin'); let p=document.createElement('div'); p.className='particle'; p.innerText="+$"+fmt(val); p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px'; p.style.color=feverMode?'var(--gold)':'var(--green)'; document.body.appendChild(p); setTimeout(()=>p.remove(),1000); if(!feverMode){fever+=5;if(fever>=100){fever=100;activateFever();}document.getElementById('fever-bar').style.width=fever+"%";} updateUI(); }
    function activateFever() { feverMode=true; notify("🔥 "+getText('fever')); document.getElementById('fever-text').style.opacity=1; let i=setInterval(()=>{fever-=1;document.getElementById('fever-bar').style.width=fever+"%";if(fever<=0){clearInterval(i);feverMode=false;document.getElementById('fever-text').style.opacity=0;}},100); }
    function spawnUFO_Logic() { if(Date.now()>nextUfoTime){spawnUFO();nextUfoTime=Date.now()+(Math.random()*120000+120000);} }
    function spawnUFO() { let d=document.createElement('div');d.className='drone';d.innerText='🛸';document.querySelector('.game-zone').appendChild(d);d.onclick=(e)=>{d.remove();let c=document.createElement('div');c.className='supply-crate';c.innerText='🎁';c.style.left=e.clientX+'px';c.style.top='20%';document.querySelector('.game-zone').appendChild(c);c.onclick=()=>{c.remove();document.getElementById('box-modal').style.display='flex';playSfx('coin');}};setTimeout(()=>d.remove(),12000); }
    
    // SISTEMA DE RECOMPENSA VARIABLE (SLOT MACHINE PSYCHOLOGY)
    function openBox(watch) { 
        document.getElementById('box-modal').style.display='none'; 
        if(watch){ 
            executeHackLogic(()=>{
                let r=Math.random();
                if(r<0.5){
                    let b=getPPS()*100+1000;
                    // Probabilidad de "CRITICAL HACK" (x2 Dinero)
                    if(Math.random() < 0.1) { b*=2; notify("🎰 CRITICAL HACK: x2 CASH!"); }
                    game.money+=b; notify("💰 +$"+fmt(b));
                }else{
                    // Probabilidad de gemas extra (3 a 5)
                    let g = 3 + Math.floor(Math.random() * 3);
                    game.gems+=g;
                    notify("💎 +"+g);
                } 
                updateUI();
            }, 'boxHack'); 
        } else { 
            let s=getPPS()*20+200;game.money+=s;notify("📦 +$"+fmt(s));updateUI(); 
        } 
    }
    
    function activateBroker() { executeHackLogic(()=>{brokerActive=true;notify(getText('working'));document.getElementById('btn-broker').innerText=getText('working');document.getElementById('btn-broker').disabled=true;setTimeout(()=>{brokerActive=false;notify(getText('done'));document.getElementById('btn-broker').innerText=getText('broker');document.getElementById('btn-broker').disabled=false;},60000);}, 'brokerHack'); }
    
    function watchAdForGems() { 
        executeHackLogic(()=>{
            // Variable Reward: 3 to 5 gems (10% chance of 6)
            let g = 3 + Math.floor(Math.random() * 2);
            if(Math.random() < 0.1) { g = 6; notify("🎰 JACKPOT!"); }
            game.gems += g;
            notify("+" + g + " Gems");
            updateUI();
        }, 'gemHack'); 
    } 
    
    function claimOffline(watch) { if(watch){executeHackLogic(()=>{game.money+=pendingOffline*1.5;document.getElementById('offline-modal').style.display='none';updateUI();notify("x1.5 CASH!");}, 'offHack');}else{game.money+=pendingOffline;document.getElementById('offline-modal').style.display='none';updateUI();} } 
    function resolveHacker(watch) { if(watch){executeHackLogic(()=>{threat=0;document.getElementById('threat-bar').style.width="0%";document.getElementById('hacker-modal').style.display='none';notify(getText('saved'));}, 'hackerHack');}else{game.money*=0.8;threat=0;document.getElementById('threat-bar').style.width="0%";document.getElementById('hacker-modal').style.display='none';notify(getText('loss'));} }
    
    function checkOfflineEarnings() { if(!game.lastLogin)game.lastLogin=Date.now(); let s=(Date.now()-game.lastLogin)/1000; if(s>60){let p=0;machinesDB.forEach((m,i)=>p+=(m.prod*game.machines[i]));if(p>0){pendingOffline=p*s;document.getElementById('offline-amount').innerText="$"+fmt(pendingOffline);document.getElementById('offline-modal').style.display='flex';}} game.lastLogin=Date.now(); }
    function buyMachine(i) { let c=Math.floor(machinesDB[i].cost*Math.pow(1.2,game.machines[i])); if(game.money>=c){game.money-=c;game.machines[i]++;updateUI();} }
    function buyDef(i) { if(game.money>=defDB[i].cost&&!game.security[i]){game.money-=defDB[i].cost;game.security[i]=1;updateUI();} }
    function buyGemItem(id,c) { if(game.gems>=c){game.gems-=c;if(id=='coffee'){boostMult=2;setTimeout(()=>boostMult=1,60000);}if(id=='shield')game.hasShield=true;if(id=='warp')game.money+=getPPS()*7200;updateUI();notify(getText('bought'));} }
    function buyDarkItem(id,c) { if(game.btc>=c){game.btc-=c;if(id=='spy')game.hasSpy=true;if(id=='over')game.overclock++;notify(getText('bought'));updateUI();} }
    function buySkin(id,c) { if(game.ownedSkins.includes(id)){game.currentSkin=id;updateUI();}else if(game.gems>=c){if(confirm('Buy?')){game.gems-=c;game.ownedSkins.push(id);game.currentSkin=id;updateUI();}} }
    function doMission(i) { let m=missionsDB[i];if(game.money>=m.cost){game.money-=m.cost;game.missions[i]=1;notify(getText('miss_ok'));updateUI();} }
    function mineBTC() { game.btc++;updateUI(); }
    function sellBTC() { if(game.btc>0){game.money+=game.btc*btcPrice;game.btc=0;updateUI();} }
    function clickWorld(el) { if(game.worldUnlocked){tab('world',el);}else{let gp=Math.min((game.gems/100)*100,100);let tp=game.machines[2]>0?100:0;document.getElementById('txt-gems').innerText=game.gems+"/100";document.getElementById('bar-gems').style.width=gp+"%";document.getElementById('txt-tech').innerText=tp===100?getText('ready'):"NO";document.getElementById('bar-tech').style.width=tp+"%";if(gp===100&&tp===100){game.worldUnlocked=true;notify("WORLD UNLOCKED!");document.getElementById('tab-world-btn').classList.remove('tab-locked');document.querySelector('.lock-icon').style.display='none';tab('world',el);}else{document.getElementById('world-modal').style.display='flex';}} }
    function tab(id,el) { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');el.classList.add('active'); }
    function showShopSection(id) { document.getElementById('items-view').style.display=id=='items'?'block':'none';document.getElementById('skins-view').style.display=id=='skins'?'grid':'none'; }
    function notify(m) { let t=document.createElement('div');t.className='toast';t.innerText=m;document.getElementById('toast-area').appendChild(t);setTimeout(()=>t.remove(),3000); }
    function fmt(n) { if(n<1000)return Math.floor(n);let s=["","k","M","B","T"];let e=Math.floor(Math.log10(n)/3);return (n/Math.pow(1000,e)).toFixed(1)+s[e]; }
    function updateUI() {
        document.getElementById('ui-money').innerText="$"+fmt(game.money);document.getElementById('ui-pps').innerText=fmt(getPPS());document.getElementById('ui-gems').innerText=game.gems;document.getElementById('btc-ui').innerText=game.btc;document.getElementById('btc-price-ui').innerText="$"+btcPrice;document.getElementById('main-emoji').innerText=skinsDB.find(s=>s.id==game.currentSkin).icon;
        let te=document.getElementById('btc-trend');if(game.hasSpy){document.getElementById('btc-price-ui').style.color="#fff";te.innerText=nextPrice>btcPrice?" 🔼":" 🔽";te.style.color=nextPrice>btcPrice?"var(--green)":"var(--accent)";}else{te.innerText="";document.getElementById('btc-price-ui').style.color=btcPrice>=oldPrice?"var(--green)":"var(--accent)";}
        let h="";machinesDB.forEach((m,i)=>{let c=Math.floor(m.cost*Math.pow(1.2,game.machines[i]));let n=lang=='es'?m.name:m.name_en;h+=`<div class="card"><div class="card-left"><div class="card-icon">${m.icon}</div><div class="card-info"><b>${n}</b><small>Nv.${game.machines[i]} (+${fmt(m.prod)}/s)</small></div></div><button class="btn-buy" ${game.money<c?'disabled':''} onclick="buyMachine(${i})">$${fmt(c)}</button></div>`;});document.getElementById('prod').innerHTML=h;
        h="";defDB.forEach((d,i)=>{let n=lang=='es'?d.name:d.name_en;let de=lang=='es'?d.desc:d.desc_en;h+=`<div class="card"><div class="card-left"><div class="card-icon">${d.icon}</div><div class="card-info"><b>${n}</b><small>${de}</small></div></div><button class="btn-buy" ${game.security[i]||game.money<d.cost?'disabled':''} onclick="buyDef(${i})">${game.security[i]?'OK':'$'+fmt(d.cost)}</button></div>`;});document.getElementById('def').innerHTML=h;
        h="";darkItemsDB.forEach(d=>{let c=d.id=='over'?500*(game.overclock+1):d.cost;let o=(d.id=='bot'&&game.hasBot)||(d.id=='spy'&&game.hasSpy);let n=lang=='es'?d.name:d.name_en;let de=lang=='es'?d.desc:d.desc_en;h+=`<div class="card" style="border-color:#bc13fe;"><div class="card-left"><div class="card-icon">${d.icon}</div><div class="card-info"><b>${n}</b><small>${de}</small></div></div><button class="btn-buy" style="background:var(--purple);" ${o||game.btc<c?'disabled':''} onclick="buyDarkItem('${d.id}',${c})">${o?'OK':c+' ₿'}</button></div>`;});document.getElementById('dark-list').innerHTML=h;
        h="";gemItemsDB.forEach(g=>{let n=lang=='es'?g.name:g.name_en;let de=lang=='es'?g.desc:g.desc_en;h+=`<div class="card"><div class="card-left"><div class="card-icon">${g.icon}</div><div class="card-info"><b>${n}</b><small>${de}</small></div></div><button class="btn-buy" style="background:var(--blue);" ${game.gems<g.cost?'disabled':''} onclick="buyGemItem('${g.id}',${g.cost})">${g.cost} 💎</button></div>`;});document.getElementById('gem-list').innerHTML=h;
        h="";skinsDB.forEach(s=>{let o=game.ownedSkins.includes(s.id);h+=`<div class="skin-item ${game.currentSkin==s.id?'active':''} ${!o&&game.gems<s.cost?'locked':''}" onclick="buySkin('${s.id}',${s.cost})"><div style="font-size:2rem;">${s.icon}</div>${!o?`<small style="color:gold">${s.cost}💎</small>`:''}</div>`;});document.getElementById('skins-view').innerHTML=h;
        if(game.worldUnlocked){document.getElementById('tab-world-btn').classList.remove('tab-locked');document.querySelector('.lock-icon').style.display='none';}
        h="";missionsDB.forEach((m,i)=>{let d=game.missions[i];let c=game.money>=m.cost;let n=lang=='es'?m.name:m.name_en;let r=lang=='es'?m.reward:m.reward_en;h+=`<div class="card" style="border-left:4px solid var(--blue);"><div class="card-left"><div class="card-icon">🌍</div><div class="card-info"><b>${n}</b><small>${r}</small></div></div><button class="btn-buy" ${d||!c?'disabled':''} onclick="doMission(${i})">${d?'OK':'$'+fmt(m.cost)}</button></div>`;});document.getElementById('mission-list').innerHTML=h;
        
        let now = Date.now();
        let diff = now - (game.lastGemHack || 0);
        let btnPack = document.getElementById('btn-pack');
        if(diff < 180000) {
            btnPack.style.opacity = "0.5";
            btnPack.innerText = "⏳ " + Math.ceil((180000-diff)/1000) + "s";
        } else {
            btnPack.style.opacity = "1";
            btnPack.innerText = getText('vid');
        }
    }
    setInterval(()=>{if(document.getElementById('hacker-modal').style.display==='flex')return;game.money+=getPPS()/10;let r=1;if(game.security[0])r-=0.1;if(game.security[1])r-=0.25;if(game.missions[4])r-=0.5;threat+=0.08*r;document.getElementById('threat-bar').style.width=threat+"%";if(threat>=100){threat=0;if(game.security[2]){game.btc+=5;notify("🛡️ "+getText('saved'));}else if(game.hasShield){game.hasShield=false;notify("🛡️ Shield used");}else{let l=Math.floor(game.money*0.2);document.getElementById('hacker-loss').innerText="-$"+fmt(l);document.getElementById('hacker-modal').style.display='block';}}if(game.hasBot&&Math.random()<0.1)doClick({clientX:window.innerWidth/2,clientY:window.innerHeight/3});updateUI();},100);
    setInterval(()=>{oldPrice=btcPrice;btcPrice=nextPrice;nextPrice=Math.floor(Math.random()*55)+5;if(brokerActive){if(btcPrice<15&&game.money>=1000){game.money-=btcPrice;game.btc++;notify("🤖 Buy");}if(btcPrice>45&&game.btc>0){game.money+=btcPrice;game.btc--;notify("🤖 Sell");}}},4000);
    setInterval(()=>{game.lastLogin=Date.now();localStorage.setItem('EmojiGalaxyV49',JSON.stringify(game));},5000);
</script>
